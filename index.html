<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OpenSport</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .active-glow {
      animation: pulse-glow 2s infinite;
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 5px rgba(132, 204, 22, 0.4);
      }

      50% {
        box-shadow: 0 0 20px rgba(132, 204, 22, 0.8);
      }
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body class="bg-gray-100">

<div id="root"></div>

<script type="text/babel">

const {
  Trophy,
  Users,
  Settings,
  ChevronRight,
  Target,
  Award,
  Search,
  Globe,
  Zap,
  Activity,
  X,
  Smartphone,
  Navigation,
  Heart,
  LocateFixed
} = lucide;

const App = () => {

  const [activeTab, setActiveTab] = React.useState('home');
  const [lang, setLang] = React.useState('EN');
  const [kcalBurned, setKcalBurned] = React.useState(24000);
  const [isWorkingOut, setIsWorkingOut] = React.useState(false);
  const [activeTeam, setActiveTeam] = React.useState(null);
  const [drawerHeight, setDrawerHeight] = React.useState(400);
  const [showPermissions, setShowPermissions] = React.useState(true);

  const KCAL_PER_POINT = 23.9;
  const currentPoints = Math.floor(kcalBurned / KCAL_PER_POINT);

  const translations = {
    EN: {
      home: "HOME",
      team: "TEAM",
      rank: "RANK",
      settings: "SETTINGS",
      welcome: "Ready for a sweat?",
      points: "PTS",
      start: "START WORKOUT",
      stop: "FINISH & SYNC",
      langBtn: "ENGLISH"
    },

    CH: {
      home: "首頁",
      team: "組隊",
      rank: "排名",
      settings: "設定",
      welcome: "準備好流汗了嗎？",
      points: "能量點數",
      start: "開始運動",
      stop: "完成並同步",
      langBtn: "繁體中文"
    }
  };

  const t = translations[lang];

  React.useEffect(() => {
    lucide.createIcons();
  }, [activeTab, lang, activeTeam]);

  return (
    <div className="flex flex-col h-screen bg-white text-slate-900 max-w-md mx-auto shadow-2xl overflow-hidden relative">

      {/* Permission Modal */}
      {showPermissions && (
        <div className="absolute inset-0 z-50 bg-black/60 flex items-end">
          <div
            className="bg-white w-full rounded-t-[40px] p-8"
            style={{ animation: "slideUp 0.3s ease-out" }}
          >

            <div className="w-12 h-1.5 bg-gray-100 rounded-full mx-auto mb-8"></div>

            <h2 className="text-2xl font-black italic mb-2 uppercase">
              Allow Access
            </h2>

            <p className="text-sm text-gray-500 mb-8">
              OpenSport needs access to track movement.
            </p>

            <button
              onClick={() => setShowPermissions(false)}
              className="w-full py-5 bg-black text-white rounded-2xl font-black"
            >
              ALLOW ACCESS
            </button>
          </div>
        </div>
      )}

      {/* Header */}
      <header className="px-6 pt-10 pb-4 bg-white z-10">

        <div className="flex items-center justify-between mb-5">

          <h1 className="text-3xl font-black italic tracking-tighter">
            OPEN<span className="text-lime-500">SPORT</span>
          </h1>

          <div className="flex bg-lime-400/10 px-4 py-2 rounded-full items-center gap-2">

            <i data-lucide="zap" className="text-lime-600"></i>

            <span className="text-sm font-black text-lime-700">
              {currentPoints} {t.points}
            </span>

          </div>
        </div>

        <div className="relative">

          <i
            data-lucide="search"
            className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 w-5 h-5"
          ></i>

          <input
            type="text"
            placeholder="Search..."
            className="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3.5 pl-12 pr-4 text-sm"
          />
        </div>
      </header>

      {/* Main */}
      <main className="flex-1 overflow-y-auto p-6 pb-24">

        {activeTab === 'home' && (
          <div className="space-y-6">

            <div className="bg-white rounded-[40px] p-8 border border-gray-100 shadow-xl">

              <p className="text-xs text-gray-400 uppercase mb-2">
                {t.welcome}
              </p>

              <h2 className="text-5xl font-black italic mb-10">
                {kcalBurned.toLocaleString()}
                <span className="text-xs ml-2 opacity-30">kcal</span>
              </h2>

              <button
                onClick={() => setIsWorkingOut(!isWorkingOut)}
                className={`w-full py-5 rounded-[24px] font-black transition-all ${
                  isWorkingOut
                    ? 'bg-white border-2 border-lime-500 text-lime-500 active-glow'
                    : 'bg-black text-white'
                }`}
              >
                {isWorkingOut ? t.stop : t.start}
              </button>
            </div>

            <div className="grid grid-cols-2 gap-5">

              <div className="bg-gray-50 p-8 rounded-[32px] flex flex-col items-center gap-3">
                <i data-lucide="target" className="text-lime-500 w-8 h-8"></i>
                <span className="text-xs font-black uppercase">
                  SOLO
                </span>
              </div>

              <div
                onClick={() => setActiveTab('team')}
                className="bg-gray-50 p-8 rounded-[32px] flex flex-col items-center gap-3 cursor-pointer"
              >
                <i data-lucide="users" className="text-lime-500 w-8 h-8"></i>

                <span className="text-xs font-black uppercase">
                  TEAM
                </span>
              </div>

            </div>
          </div>
        )}

        {activeTab === 'team' && (
          <div className="space-y-5">

            <h2 className="text-2xl font-black italic">
              Nearby Teams
            </h2>

            {[1,2,3].map(id => (
              <div
                key={id}
                className="bg-white p-6 rounded-[32px] border border-gray-100 flex justify-between items-center shadow-sm"
              >

                <div>
                  <h3 className="font-black">TEAM #{id}</h3>
                  <p className="text-xs text-gray-400">
                    ACTIVE SESSION
                  </p>
                </div>

                <button
                  className="bg-black text-white px-6 py-2 rounded-2xl text-xs font-black"
                >
                  JOIN
                </button>

              </div>
            ))}
          </div>
        )}

        {activeTab === 'rank' && (
          <div className="space-y-5">

            <h2 className="text-2xl font-black italic">
              Rankings
            </h2>

            {[1,2,3,4,5].map(pos => (
              <div
                key={pos}
                className="bg-gray-50 rounded-2xl p-5 flex justify-between"
              >
                <span className="font-black">#{pos}</span>
                <span>{1000 - pos * 50} pts</span>
              </div>
            ))}

          </div>
        )}

        {activeTab === 'settings' && (
          <div className="space-y-5">

            <h2 className="text-2xl font-black italic">
              Settings
            </h2>

            <button
              onClick={() => setLang(lang === 'EN' ? 'CH' : 'EN')}
              className="w-full bg-gray-50 rounded-3xl p-6 flex justify-between items-center"
            >
              <span className="font-black">
                Language
              </span>

              <span className="bg-black text-white px-4 py-2 rounded-2xl text-xs">
                {t.langBtn}
              </span>
            </button>

          </div>
        )}

      </main>

      {/* Bottom Nav */}
      <nav className="bg-white border-t border-gray-100 flex justify-around items-center px-6 py-5 sticky bottom-0">

        {[
          {id:'home', icon:'target', label:t.home},
          {id:'team', icon:'users', label:t.team},
          {id:'rank', icon:'award', label:t.rank},
          {id:'settings', icon:'settings', label:t.settings}
        ].map(btn => (

          <button
            key={btn.id}
            onClick={() => setActiveTab(btn.id)}
            className={`flex flex-col items-center gap-1 ${
              activeTab === btn.id
                ? 'text-lime-500'
                : 'text-gray-300'
            }`}
          >

            <i data-lucide={btn.icon} className="w-6 h-6"></i>

            <span className="text-[9px] font-black uppercase">
              {btn.label}
            </span>

          </button>
        ))}

      </nav>

    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

</body>
</html>
