<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OpenSport</title>

<script src="https://cdn.tailwindcss.com"></script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body{
  margin:0;
  background:#f8fafc;
  font-family:sans-serif;
}

@keyframes slideUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.5}
}

.animate-pulse{
  animation:pulse 1.5s infinite;
}

*{
  -webkit-tap-highlight-color:transparent;
}
</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const App = () => {

  const [activeTab,setActiveTab] = React.useState("home");
  const [lang,setLang] = React.useState("EN");
  const [activeTeam,setActiveTeam] = React.useState(null);
  const [showPermissions,setShowPermissions] = React.useState(true);

  const [drawerHeight,setDrawerHeight] = React.useState(380);

  const [isWorkingOut,setIsWorkingOut] = React.useState(false);

  const [kcal,setKcal] = React.useState(24000);

  const [points,setPoints] = React.useState(1000);

  const [mapScale,setMapScale] = React.useState(1);

  const [mapPos,setMapPos] = React.useState({
    x:0,
    y:0
  });

  const [toggles,setToggles] = React.useState({
    location:true,
    stealth:false,
    reminders:true
  });

  const [permissions,setPermissions] = React.useState({
    health:false,
    motion:false,
    gps:false
  });

  const translations = {
    EN:{
      home:"HOME",
      team:"TEAM",
      rank:"RANK",
      settings:"SETTINGS",
      welcome:"Ready for a sweat?",
      start:"START WORKOUT",
      stop:"FINISH & SYNC",
      join:"JOIN",
      nearby:"NEARBY TEAMS",
      participants:"PARTICIPANTS",
      leave:"LEAVE SESSION",
      language:"Language",
      rankTitle:"RANKING"
    },

    CH:{
      home:"首頁",
      team:"組隊",
      rank:"排名",
      settings:"設定",
      welcome:"準備好流汗了嗎？",
      start:"開始運動",
      stop:"完成並同步",
      join:"加入",
      nearby:"附近隊伍",
      participants:"參與者",
      leave:"離開小組",
      language:"語言",
      rankTitle:"排名"
    }
  };

  const t = translations[lang];

  React.useEffect(()=>{

    let interval;

    if(isWorkingOut){

      interval = setInterval(()=>{

        setKcal(prev=>prev+1);

      },500);

    }

    return ()=>clearInterval(interval);

  },[isWorkingOut]);

  const toggleWorkout = ()=>{

    if(!isWorkingOut){

      setIsWorkingOut(true);

    }else{

      setIsWorkingOut(false);

      setPoints(prev=>prev+10);

    }

  };

  const zoomIn = ()=>{

    setMapScale(prev=>Math.min(prev+0.2,3));

  };

  const zoomOut = ()=>{

    setMapScale(prev=>Math.max(prev-0.2,0.5));

  };

  const moveDrawer = (e)=>{

    let y = e.touches[0].clientY;

    let newHeight = window.innerHeight - y;

    if(newHeight < 80) newHeight = 80;

    if(newHeight > 600) newHeight = 600;

    setDrawerHeight(newHeight);

  };

  return (

    <div className="flex flex-col h-screen bg-white max-w-md mx-auto overflow-hidden shadow-2xl relative">

      {/* PERMISSIONS */}

      {showPermissions && (

        <div className="absolute inset-0 bg-black/60 z-50 flex items-end">

          <div
            className="bg-white w-full rounded-t-[40px] p-8"
            style={{animation:"slideUp .3s ease-out"}}
          >

            <div className="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-8"></div>

            <h2 className="text-2xl font-black italic mb-3">
              Allow Access
            </h2>

            <p className="text-xs text-gray-400 uppercase mb-8">
              OpenSport needs permissions.
            </p>

            <div className="space-y-4 mb-8">

              {["health","motion","gps"].map(item=>(

                <div
                  key={item}
                  className="flex justify-between items-center bg-gray-50 p-5 rounded-2xl"
                >

                  <span className="font-black uppercase text-xs">
                    {item}
                  </span>

                  <button
                    onClick={()=>setPermissions(prev=>({
                      ...prev,
                      [item]:true
                    }))}
                    className={`px-4 py-2 rounded-xl text-xs font-black ${
                      permissions[item]
                      ? "bg-lime-400 text-black"
                      : "bg-black text-white"
                    }`}
                  >
                    {permissions[item] ? "GRANTED" : "ALLOW"}
                  </button>

                </div>

              ))}

            </div>

            <button
              disabled={
                !permissions.health ||
                !permissions.motion ||
                !permissions.gps
              }
              onClick={()=>setShowPermissions(false)}
              className="w-full py-5 bg-black text-white rounded-2xl font-black disabled:bg-gray-200 disabled:text-gray-400"
            >
              CONTINUE
            </button>

          </div>

        </div>

      )}

      {/* HEADER */}

      <header className="px-6 pt-10 pb-5 bg-white z-20">

        <div className="flex justify-between items-center">

          <h1 className="text-3xl font-black italic">
            OPEN<span className="text-lime-500">SPORT</span>
          </h1>

          <div className="bg-lime-100 px-4 py-2 rounded-full font-black text-lime-700">
            {points} PTS
          </div>

        </div>

      </header>

      {/* MAIN */}

      <main className="flex-1 relative overflow-hidden">

        {activeTab === "home" && (

          <div className="p-6 space-y-6 pb-24 overflow-y-auto h-full">

            <div className="bg-white rounded-[40px] p-8 shadow-xl border border-gray-100 text-center">

              <p className="text-xs uppercase text-gray-300 mb-3 font-black">
                {t.welcome}
              </p>

              <h2 className="text-5xl font-black italic mb-10">
                {kcal.toLocaleString()}
                <span className="text-sm opacity-30 ml-2">
                  kcal
                </span>
              </h2>

              <button
                onClick={toggleWorkout}
                className={`w-full py-5 rounded-[24px] font-black transition-all ${
                  isWorkingOut
                  ? "bg-red-50 text-red-500 border border-red-200"
                  : "bg-black text-white"
                }`}
              >
                {isWorkingOut ? t.stop : t.start}
              </button>

            </div>

            <div className="grid grid-cols-2 gap-5">

              <div
                onClick={toggleWorkout}
                className="bg-gray-50 rounded-[32px] p-8 flex flex-col items-center cursor-pointer active:scale-95"
              >

                <div className="text-4xl mb-3">
                  🎯
                </div>

                <span className="font-black text-xs uppercase">
                  SOLO
                </span>

              </div>

              <div
                onClick={()=>setActiveTab("team")}
                className="bg-gray-50 rounded-[32px] p-8 flex flex-col items-center cursor-pointer active:scale-95"
              >

                <div className="text-4xl mb-3">
                  👥
                </div>

                <span className="font-black text-xs uppercase">
                  TEAM
                </span>

              </div>

            </div>

          </div>

        )}

        {activeTab === "team" && !activeTeam && (

          <div className="p-6 space-y-5 pb-24 overflow-y-auto h-full">

            <h2 className="text-2xl font-black italic">
              {t.nearby}
            </h2>

            {[1,2,3].map(id=>(

              <div
                key={id}
                onClick={()=>setActiveTeam(id)}
                className="bg-white p-6 rounded-[32px] border border-gray-100 shadow-sm flex justify-between items-center active:scale-95"
              >

                <div>

                  <h3 className="font-black">
                    TEAM #{id}
                  </h3>

                  <p className="text-xs text-gray-400">
                    {5+id} MEMBERS
                  </p>

                </div>

                <button className="bg-black text-white px-6 py-2 rounded-2xl text-xs font-black">
                  {t.join}
                </button>

              </div>

            ))}

          </div>

        )}

        {activeTeam && (

          <div className="absolute inset-0 bg-white z-30 overflow-hidden">

            {/* MAP */}

            <div className="absolute inset-0 bg-slate-100 overflow-hidden">

              <div
                className="absolute inset-0 flex items-center justify-center"
                style={{
                  transform:`translate(${mapPos.x}px,${mapPos.y}px) scale(${mapScale})`
                }}
              >

                <svg width="1000" height="1500">

                  <rect width="1000" height="1500" fill="#f1f5f9"/>

                  <path
                    d="M300 1200 Q500 900 800 500"
                    stroke="#3b82f6"
                    strokeWidth="16"
                    fill="none"
                    opacity="0.4"
                  />

                  <circle cx="300" cy="1200" r="20" fill="#22c55e"/>

                  <circle cx="800" cy="500" r="20" fill="#ef4444"/>

                  <circle cx="500" cy="800" r="16" fill="#3b82f6"/>

                </svg>

              </div>

              {/* MAP BUTTONS */}

              <div className="absolute top-24 right-5 flex flex-col gap-3">

                <button
                  onClick={zoomIn}
                  className="w-12 h-12 rounded-2xl bg-white shadow-xl text-2xl"
                >
                  +
                </button>

                <button
                  onClick={zoomOut}
                  className="w-12 h-12 rounded-2xl bg-white shadow-xl text-2xl"
                >
                  -
                </button>

              </div>

            </div>

            {/* BACK */}

            <button
              onClick={()=>setActiveTeam(null)}
              className="absolute top-6 left-6 w-12 h-12 rounded-full bg-white shadow-xl z-40"
            >
              ✕
            </button>

            {/* DRAWER */}

            <div
              className="absolute bottom-0 left-0 right-0 bg-white rounded-t-[45px] shadow-2xl z-50 overflow-hidden"
              style={{
                height:drawerHeight+"px"
              }}
            >

              <div
                className="pt-4 pb-6 flex flex-col items-center"
                onTouchMove={moveDrawer}
              >

                <div className="w-14 h-1.5 rounded-full bg-gray-200 mb-4"></div>

                <span className="text-xs font-black text-gray-300 uppercase">
                  {t.participants}
                </span>

              </div>

              <div className="px-8 pb-12 overflow-y-auto h-full">

                <div className="space-y-4">

                  <div className="bg-lime-50 border border-lime-100 p-5 rounded-[28px] flex items-center gap-4">

                    <div className="w-12 h-12 rounded-2xl bg-white border-2 border-lime-400 flex items-center justify-center font-black">
                      ME
                    </div>

                    <div>

                      <div className="font-black text-xs uppercase text-lime-700">
                        YOU
                      </div>

                      <div className="text-xs text-lime-400 uppercase">
                        TRACKING
                      </div>

                    </div>

                  </div>

                  {[1,2,3].map(i=>(

                    <div
                      key={i}
                      className="bg-gray-50 p-5 rounded-[28px] flex items-center gap-4"
                    >

                      <div className="w-12 h-12 rounded-2xl bg-white flex items-center justify-center font-black text-gray-400">
                        #{i}
                      </div>

                      <div className="font-black text-xs uppercase">
                        USER_{i}
                      </div>

                    </div>

                  ))}

                </div>

              </div>

            </div>

          </div>

        )}

        {activeTab === "rank" && (

          <div className="p-6 pb-24 overflow-y-auto h-full">

            <h2 className="text-2xl font-black italic mb-6">
              {t.rankTitle}
            </h2>

            <div className="bg-white rounded-[40px] overflow-hidden border border-gray-100">

              {[1,2,3,4,5].map(pos=>(

                <div
                  key={pos}
                  className={`p-6 flex justify-between items-center ${
                    pos !== 5 ? "border-b border-gray-50" : ""
                  }`}
                >

                  <div className="font-black text-2xl italic text-lime-500">
                    0{pos}
                  </div>

                  <div className="flex-1 px-5">

                    <div className="font-black uppercase text-xs mb-2">
                      {pos===4 ? "YOU" : "USER_"+pos}
                    </div>

                    <div className="h-2 rounded-full bg-gray-100">

                      <div
                        className="h-2 rounded-full bg-lime-400"
                        style={{
                          width:(100-pos*10)+"%"
                        }}
                      ></div>

                    </div>

                  </div>

                  <div className="font-black italic">
                    {1000-pos*50}
                  </div>

                </div>

              ))}

            </div>

          </div>

        )}

        {activeTab === "settings" && (

          <div className="p-6 pb-24 space-y-5 overflow-y-auto h-full">

            <h2 className="text-2xl font-black italic">
              {t.settings}
            </h2>

            <div
              onClick={()=>setLang(prev=>prev==="EN"?"CH":"EN")}
              className="bg-gray-50 p-6 rounded-[32px] flex justify-between items-center active:scale-95"
            >

              <span className="font-black uppercase">
                {t.language}
              </span>

              <div className="bg-black text-white px-5 py-2 rounded-2xl text-xs font-black">
                {lang}
              </div>

            </div>

            <div className="bg-gray-50 p-6 rounded-[32px] flex justify-between items-center">

              <span className="font-black uppercase">
                Share Location
              </span>

              <button
                onClick={()=>setToggles(prev=>({
                  ...prev,
                  location:!prev.location
                }))}
                className={`w-14 h-7 rounded-full transition-all ${
                  toggles.location
                  ? "bg-lime-400"
                  : "bg-gray-300"
                }`}
              >

                <div
                  className={`w-5 h-5 rounded-full bg-white mt-1 transition-all ${
                    toggles.location
                    ? "ml-8"
                    : "ml-1"
                  }`}
                ></div>

              </button>

            </div>

          </div>

        )}

      </main>

      {/* NAV */}

      <nav className="bg-white border-t border-gray-100 flex justify-around items-center px-6 py-5 sticky bottom-0 z-40">

        {[
          {id:"home",label:t.home,emoji:"🏠"},
          {id:"team",label:t.team,emoji:"👥"},
          {id:"rank",label:t.rank,emoji:"🏆"},
          {id:"settings",label:t.settings,emoji:"⚙️"}
        ].map(btn=>(

          <button
            key={btn.id}
            onClick={()=>{
              setActiveTab(btn.id);
              setActiveTeam(null);
            }}
            className={`flex flex-col items-center gap-1 w-full ${
              activeTab===btn.id
              ? "text-lime-500 scale-110"
              : "text-gray-300"
            }`}
          >

            <div className="text-2xl">
              {btn.emoji}
            </div>

            <span className="text-[9px] font-black uppercase">
              {btn.label}
            </span>

          </button>

        ))}

      </nav>

    </div>

  );

};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
